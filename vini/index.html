<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Esperienza AR Vino</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: linear-gradient(180deg, #5f8f70, #163d2a);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 24px;
    }

    #startScreen h1 {
      color: #f0d58a;
      margin-bottom: 12px;
      font-size: 28px;
    }

    #startScreen p {
      max-width: 340px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    #startButton {
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #f0d58a, #d8a94a);
      color: #17351f;
      padding: 15px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      z-index: 999999;
      background: rgba(0,0,0,0.65);
      color: white;
      font-size: 12px;
      padding: 8px;
      border-radius: 8px;
      display: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
</head>

<body>

  <div id="startScreen">
    <h1>Esperienza AR Vino</h1>
    <p>Premi il pulsante, consenti la fotocamera e inquadra l'etichetta.</p>
    <button id="startButton">Avvia realtà aumentata</button>
  </div>

  <div id="debug"></div>

  <a-scene
    id="scene"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="alpha: true; antialias: true; colorManagement: true"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      maxTrack: 1;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "
  >

    <a-assets timeout="30000">
      <video
        id="vinoVideo"
        src="./assets/videos/vino.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        muted
      ></video>

      <audio
        id="vinoAudio"
        src="./assets/audio/vino.mp3"
        preload="auto"
        crossorigin="anonymous"
      ></audio>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="rayOrigin: mouse"
    ></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <a-video
        id="arVideo"
        src="#vinoVideo"
        position="0 0 0"
        rotation="0 0 0"
        width="1.2"
        height="1.75"
        visible="false"
      ></a-video>

    </a-entity>

  </a-scene>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const debug = document.getElementById("debug");

    const scene = document.getElementById("scene");
    const target = document.getElementById("target");
    const arVideo = document.getElementById("arVideo");

    const video = document.getElementById("vinoVideo");
    const audio = document.getElementById("vinoAudio");

    let arStarted = false;
    let videoStarted = false;

    function log(text) {
      debug.style.display = "block";
      debug.innerHTML = text;
      console.log(text);
    }

    function showARVideo() {
      arVideo.setAttribute("visible", "true");
      arVideo.object3D.visible = true;
    }

    function hideARVideo() {
      arVideo.setAttribute("visible", "false");
      arVideo.object3D.visible = false;
    }

    async function unlockMedia() {
      try {
        video.muted = true;
        video.currentTime = 0;
        await video.play();
        video.pause();
        video.currentTime = 0;
        log("Video sbloccato");
      } catch (e) {
        log("Video non sbloccato, continuo comunque");
        console.warn(e);
      }

      try {
        audio.currentTime = 0;
        await audio.play();
        audio.pause();
        audio.currentTime = 0;
        log("Audio sbloccato");
      } catch (e) {
        log("Audio non sbloccato, continuo comunque");
        console.warn(e);
      }
    }

    async function startAR() {
      if (arStarted) return;

      try {
        const mindarSystem = scene.systems["mindar-image-system"];

        if (!mindarSystem) {
          log("Errore: MindAR non caricato");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
          return;
        }

        log("Avvio fotocamera...");
        await mindarSystem.start();

        arStarted = true;
        startScreen.style.display = "none";

        hideARVideo();
        log("AR attiva. Inquadra l'etichetta.");

      } catch (e) {
        log("Errore avvio AR: controlla permessi camera, HTTPS e targets.mind");
        console.error(e);

        startButton.disabled = false;
        startButton.textContent = "Riprova";
      }
    }

    async function playExperience() {
      if (videoStarted) return;

      videoStarted = true;

      try {
        log("Target riconosciuto. Avvio video...");

        video.pause();
        audio.pause();

        video.currentTime = 0;
        audio.currentTime = 0;

        video.muted = true;

        showARVideo();

        await video.play();

        try {
          await audio.play();
        } catch (e) {
          console.warn("Audio bloccato:", e);
        }

        log("Video AR in riproduzione");

      } catch (e) {
        log("Errore riproduzione video");
        console.error(e);
        videoStarted = false;
      }
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "Avvio...";

      log("Preparazione media...");
      await unlockMedia();

      if (scene.hasLoaded) {
        startAR();
      } else {
        scene.addEventListener("loaded", startAR, { once: true });
      }
    });

    target.addEventListener("targetFound", () => {
      playExperience();
    });

    target.addEventListener("targetLost", () => {
      log("Target perso. Il video continua.");
    });

    video.addEventListener("ended", () => {
      log("Video terminato. Inquadra di nuovo per ripartire.");

      video.pause();
      audio.pause();

      video.currentTime = 0;
      audio.currentTime = 0;

      hideARVideo();
      videoStarted = false;
    });

    window.addEventListener("error", function(e) {
      log("Errore pagina: " + e.message);
    });
  </script>

</body>
</html>
