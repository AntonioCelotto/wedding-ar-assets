<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MENU IN AR – DEBUG TARGET</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #111;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 18px;
      background: rgba(0,0,0,.85);
    }

    .card {
      width: min(520px, 100%);
      background: rgba(255,255,255,.95);
      border-radius: 22px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      background: #111;
      color: white;
    }

    .pill {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      z-index: 30;
      pointer-events: none;
    }

    .badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.85);
      color: #111;
      font-size: 13px;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
  </style>
</head>

<body>

  <div class="pill">
    <div class="badge" id="status">DEBUG pronto</div>
    <div class="badge" id="page">Target: nessuno</div>
  </div>

  <div class="overlay" id="ui">
    <div class="card">
      <h2 style="margin-top:0;">Debug target MindAR</h2>
      <p>Questo test serve solo a capire se il secondo target viene riconosciuto davvero.</p>
      <button class="btn" id="startBtn">Avvia esperienza</button>
    </div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- target 0 -->
    <a-entity id="t0" mindar-image-target="targetIndex: 0">
      <a-plane
        id="p0"
        width="1.2"
        height="0.675"
        visible="false"
        material="shader: flat; color: red; opacity: 0.7">
      </a-plane>
    </a-entity>

    <!-- target 1 -->
    <a-entity id="t1" mindar-image-target="targetIndex: 1">
      <a-plane
        id="p1"
        width="1.2"
        height="0.675"
        visible="false"
        material="shader: flat; color: blue; opacity: 0.7">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const status = document.getElementById("status");
    const page = document.getElementById("page");
    const scene = document.getElementById("arScene");

    const t0 = document.getElementById("t0");
    const t1 = document.getElementById("t1");
    const p0 = document.getElementById("p0");
    const p1 = document.getElementById("p1");

    function setStatus(text) {
      status.textContent = text;
    }

    function waitForSceneReady() {
      return new Promise((resolve) => {
        if (scene.hasLoaded) {
          resolve();
          return;
        }
        scene.addEventListener("loaded", resolve, { once: true });
      });
    }

    startBtn.addEventListener("click", async () => {
      try {
        setStatus("Carico scena...");
        await waitForSceneReady();

        if (!scene.systems["mindar-image-system"]) {
          throw new Error("mindar-image-system non disponibile");
        }

        setStatus("Avvio camera...");
        await scene.systems["mindar-image-system"].start();

        ui.style.display = "none";
        setStatus("Inquadra i target");
      } catch (e) {
        console.error(e);
        setStatus("Errore avvio");
        alert("Avvio non riuscito");
      }
    });

    t0.addEventListener("targetFound", () => {
      p0.setAttribute("visible", true);
      p1.setAttribute("visible", false);
      setStatus("Trovato target 0");
      page.textContent = "Target: 0 (rosso)";
      console.log("TARGET 0 TROVATO");
    });

    t0.addEventListener("targetLost", () => {
      p0.setAttribute("visible", false);
      setStatus("Perso target 0");
      page.textContent = "Target: nessuno";
      console.log("TARGET 0 PERSO");
    });

    t1.addEventListener("targetFound", () => {
      p1.setAttribute("visible", true);
      p0.setAttribute("visible", false);
      setStatus("Trovato target 1");
      page.textContent = "Target: 1 (blu)";
      console.log("TARGET 1 TROVATO");
    });

    t1.addEventListener("targetLost", () => {
      p1.setAttribute("visible", false);
      setStatus("Perso target 1");
      page.textContent = "Target: nessuno";
      console.log("TARGET 1 PERSO");
    });
  </script>

</body>
</html>
