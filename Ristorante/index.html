<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MENU IN AR – Standalone</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(#0f0f12, #1a1a1f);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.10), rgba(255,255,255,0) 55%),
        linear-gradient(#0f0f12, #1a1a1f);
    }

    .card {
      width: min(520px, 100%);
      background: rgba(20,20,24,.82);
      border: 1px solid rgba(212,175,55,.35);
      border-radius: 22px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
    }

    .title {
      margin: 2px 0 6px;
      font-size: 20px;
      font-weight: 900;
      color: #f7f7fb;
      letter-spacing: .3px;
    }

    .sub {
      margin: 0 0 12px;
      font-size: 14px;
      color: rgba(247,247,251,.78);
      line-height: 1.4;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 900;
      cursor: pointer;
      background: rgba(255,255,255,.95);
      color: #111;
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }

    .btn.primary {
      background: #D4AF37;
      color: #111;
    }

    .pill {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      z-index: 30;
      pointer-events: none;
    }

    .badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(20,20,24,.55);
      border: 1px solid rgba(212,175,55,.35);
      color: rgba(247,247,251,.88);
      font-size: 13px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }

    .badge strong {
      font-weight: 900;
      color: #D4AF37;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="pill">
    <div class="badge" id="status"><strong>AR</strong> Pronto ✨</div>
    <div class="badge hidden" id="page">Pagina: —</div>
  </div>

  <div class="overlay" id="ui">
    <div class="card">
      <div class="title">MENU IN AR</div>
      <div class="sub">
        Tocca “Avvia esperienza”, consenti la fotocamera, poi inquadra la pagina AR.
      </div>
      <div class="row">
        <button class="btn primary" id="startBtn">Avvia esperienza</button>
        <button class="btn" id="helpBtn">Come funziona</button>
      </div>
      <div class="sub" style="margin-top:10px;font-size:12.5px;">
        Consiglio: luce buona + pagina ferma 1–2 sec.
      </div>
    </div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="v1"
        crossorigin="anonymous"
        src="https://video.wixstatic.com/video/047e10_dd971dc9e3634cc4b4e0871af681ecc6/720p/mp4/file.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        muted
      ></video>

      <video id="v2"
        crossorigin="anonymous"
        src="https://video.wixstatic.com/video/047e10_e96865f9d61b400f86cb7da023625588/720p/mp4/file.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        muted
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity id="t0" mindar-image-target="targetIndex: 0">
      <a-plane
        id="p0"
        width="1.2"
        height="0.675"
        position="0 0 0"
        visible="false"
        material="shader: flat; src: #v1">
      </a-plane>
    </a-entity>

    <a-entity id="t1" mindar-image-target="targetIndex: 1">
      <a-plane
        id="p1"
        width="1.2"
        height="0.675"
        position="0 0 0"
        visible="false"
        material="shader: flat; src: #v2">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const helpBtn = document.getElementById("helpBtn");
    const status = document.getElementById("status");
    const page = document.getElementById("page");
    const scene = document.getElementById("arScene");

    const t0 = document.getElementById("t0");
    const t1 = document.getElementById("t1");

    const p0 = document.getElementById("p0");
    const p1 = document.getElementById("p1");

    const v1 = document.getElementById("v1");
    const v2 = document.getElementById("v2");

    let activeIdx = null;
    let sceneReady = false;

    const targetInfo = {
      0: { video: v1, plane: p0, name: "Lo Chef presenta" },
      1: { video: v2, plane: p1, name: "Il piatto in AR" }
    };

    function setStatus(text) {
      status.textContent = "AR " + text;
    }

    function showPage(name) {
      page.classList.remove("hidden");
      page.textContent = "Pagina: " + name;
    }

    function hidePage() {
      page.classList.add("hidden");
      page.textContent = "Pagina: —";
    }

    function stopAllVideos() {
      [v1, v2].forEach(v => {
        try {
          v.pause();
          v.currentTime = 0;
          v.muted = true;
        } catch (e) {}
      });

      p0.setAttribute("visible", false);
      p1.setAttribute("visible", false);
    }

    async function unlockVideos() {
      for (const v of [v1, v2]) {
        try {
          v.muted = true;
          await v.play();
          v.pause();
          v.currentTime = 0;
        } catch (e) {
          console.log("unlock skip", e);
        }
      }
    }

    function waitForSceneReady() {
      return new Promise((resolve) => {
        if (scene.hasLoaded) {
          sceneReady = true;
          resolve();
          return;
        }

        scene.addEventListener("loaded", () => {
          sceneReady = true;
          resolve();
        }, { once: true });
      });
    }

    const audioBtn = document.createElement("button");
    audioBtn.className = "btn";
    audioBtn.textContent = "Attiva audio";
    audioBtn.style.position = "fixed";
    audioBtn.style.bottom = "14px";
    audioBtn.style.left = "50%";
    audioBtn.style.transform = "translateX(-50%)";
    audioBtn.style.zIndex = "40";
    audioBtn.style.display = "none";
    document.body.appendChild(audioBtn);

    audioBtn.addEventListener("click", async () => {
      if (activeIdx === null) return;

      const info = targetInfo[activeIdx];
      if (!info) return;

      try {
        info.video.muted = false;
        await info.video.play();
        audioBtn.style.display = "none";
      } catch (e) {
        console.error("Errore audio:", e);
        alert("Audio non avviato");
      }
    });

    helpBtn.addEventListener("click", () => {
      alert(
        "1) Tocca 'Avvia esperienza'\n" +
        "2) Consenti la fotocamera\n" +
        "3) Inquadra la copertina oppure la pagina menu"
      );
    });

    startBtn.addEventListener("click", async () => {
      try {
        setStatus("Carico scena...");
        await waitForSceneReady();

        if (!scene.systems["mindar-image-system"]) {
          throw new Error("mindar-image-system non disponibile");
        }

        setStatus("Sblocco video...");
        await unlockVideos();

        setStatus("Avvio camera...");
        await scene.systems["mindar-image-system"].start();

        ui.style.display = "none";
        setStatus("Inquadra una pagina ✨");
      } catch (e) {
        console.error("Errore start:", e);
        setStatus("Errore avvio");
        alert("Avvio non riuscito. Controlla targets.mind e fotocamera.");
      }
    });

    async function handleFound(idx) {
      const info = targetInfo[idx];
      if (!info) return;

      activeIdx = idx;

      stopAllVideos();

      info.plane.setAttribute("visible", true);
      showPage(info.name);
      setStatus("Trovato target " + idx + " ✅");

      try {
        info.video.muted = true;
        info.video.currentTime = 0;
        await info.video.play();
        audioBtn.style.display = "inline-block";
      } catch (e) {
        console.error("Errore play video target", idx, e);
      }
    }

    function handleLost(idx) {
      if (activeIdx !== idx) return;

      activeIdx = null;
      hidePage();
      audioBtn.style.display = "none";
      stopAllVideos();
      setStatus("Inquadra una pagina ✨");
    }

    t0.addEventListener("targetFound", async () => {
      await handleFound(0);
    });

    t1.addEventListener("targetFound", async () => {
      await handleFound(1);
    });

    t0.addEventListener("targetLost", () => {
      handleLost(0);
    });

    t1.addEventListener("targetLost", () => {
      handleLost(1);
    });
  </script>

</body>
</html>
