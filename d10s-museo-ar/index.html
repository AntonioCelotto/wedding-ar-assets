<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>D10S Museo Maradona AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}

html,body{
margin:0;width:100%;height:100%;overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#020617;color:white;
}

/* 🔴 FIX DOPPIO SCANNER */
.mindar-ui-overlay,
.mindar-ui-scanning,
.mindar-ui-loading,
.mindar-ui-compatibility{
display:none!important;
opacity:0!important;
pointer-events:none!important;
}

a-scene{
position:fixed!important;
inset:0!important;
width:100vw!important;
height:100vh!important;
z-index:1;
}

/* UI */
.overlay{
position:fixed;inset:0;
display:flex;align-items:center;justify-content:center;
z-index:30;
background:linear-gradient(135deg,#020617,#061b3a);
}

.card{
padding:30px;
border-radius:30px;
background:rgba(255,255,255,.1);
text-align:center;
}

.title{
font-size:70px;
font-weight:900;
background:linear-gradient(90deg,#fff,#00a2ff,#ffd700);
-webkit-background-clip:text;
color:transparent;
}

.btn{
margin-top:20px;
padding:15px 25px;
border:none;border-radius:999px;
background:#00a2ff;color:white;
font-weight:bold;cursor:pointer;
}

/* SCANNER */
.scan-frame{
position:fixed;inset:0;
z-index:12;
display:none;
pointer-events:none;
}

.scan-box{
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
width:320px;height:260px;
}

.corner{
position:absolute;
width:60px;height:60px;
border:6px solid white;
}

.c1{top:0;left:0;border-right:none;border-bottom:none}
.c2{top:0;right:0;border-left:none;border-bottom:none}
.c3{bottom:0;left:0;border-right:none;border-top:none}
.c4{bottom:0;right:0;border-left:none;border-top:none}

.scan-label{
position:fixed;
bottom:20px;left:50%;
transform:translateX(-50%);
z-index:15;
display:none;
}

/* VIDEO */
.video-layer{
position:fixed;inset:0;
z-index:25;
display:none;
align-items:center;
justify-content:center;
}

.video-wrap{
width:80vw;
max-width:360px;
}

#playerVideo{
width:100%;
background:black;
}

.close-video{
position:fixed;
top:20px;right:20px;
z-index:9999;
display:none;
}

.audio-btn{
position:fixed;
top:70px;left:50%;
transform:translateX(-50%);
z-index:9999;
display:none;
}
</style>
</head>

<body>

<div class="overlay" id="ui">
  <div class="card">
    <div class="title">D10S</div>
    <button class="btn" id="startBtn">Avvia esperienza</button>
  </div>
</div>

<div class="scan-frame" id="scanFrame">
  <div class="scan-box">
    <div class="corner c1"></div>
    <div class="corner c2"></div>
    <div class="corner c3"></div>
    <div class="corner c4"></div>
  </div>
</div>

<div class="scan-label" id="scanLabel">Inquadra il target</div>

<button class="close-video" id="closeVideo">X</button>
<button class="audio-btn" id="audioBtn">🔊 Audio</button>

<div class="video-layer" id="videoLayer">
  <div class="video-wrap">
    <video id="playerVideo" playsinline webkit-playsinline muted></video>
  </div>
</div>

<a-scene
mindar-image="imageTargetSrc: targets.mind; autoStart:false; filterMinCF:0.0001; filterBeta:0.01;"
embedded
vr-mode-ui="enabled:false">

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity id="target0" mindar-image-target="targetIndex:0"></a-entity>
<a-entity id="target1" mindar-image-target="targetIndex:1"></a-entity>
<a-entity id="target2" mindar-image-target="targetIndex:2"></a-entity>

</a-scene>

<script>
const startBtn=document.getElementById("startBtn");
const ui=document.getElementById("ui");
const scanFrame=document.getElementById("scanFrame");
const scanLabel=document.getElementById("scanLabel");
const videoLayer=document.getElementById("videoLayer");
const playerVideo=document.getElementById("playerVideo");
const closeVideo=document.getElementById("closeVideo");
const audioBtn=document.getElementById("audioBtn");
const scene=document.querySelector("a-scene");

const targets=[
document.getElementById("target0"),
document.getElementById("target1"),
document.getElementById("target2")
];

const videoMap={
0:"video.mp4",
1:"video1.mp4",
2:"video2.mp4"
};

let playing=false;

startBtn.onclick=async()=>{
await scene.systems["mindar-image-system"].start();
ui.style.display="none";
scanFrame.style.display="block";
scanLabel.style.display="block";
};

targets.forEach((t,i)=>{
t.addEventListener("targetFound",()=>{
if(playing)return;
playing=true;

playerVideo.src=videoMap[i];
playerVideo.currentTime=0;
playerVideo.muted=true;
playerVideo.load();

videoLayer.style.display="flex";
closeVideo.style.display="block";
audioBtn.style.display="block";

scanFrame.style.display="none";
scanLabel.style.display="none";

playerVideo.play();
});
});

audioBtn.onclick=async()=>{
playerVideo.muted=false;
await playerVideo.play();
audioBtn.style.display="none";
};

function reset(){
playing=false;
playerVideo.pause();
videoLayer.style.display="none";
closeVideo.style.display="none";
audioBtn.style.display="none";
scanFrame.style.display="block";
scanLabel.style.display="block";
}

closeVideo.onclick=reset;
playerVideo.onended=reset;
</script>

</body>
</html>
