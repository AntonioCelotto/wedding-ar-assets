<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D10S AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial;
  background: #000;
}

a-scene {
  position: fixed !important;
  inset: 0;
}

/* overlay start */
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0b1d3a;
  z-index: 10;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
}

.btn {
  margin-top: 10px;
  padding: 10px 16px;
  border: none;
  border-radius: 20px;
  background: #0077ff;
  color: white;
  font-weight: bold;
}

/* VIDEO PERFETTAMENTE CENTRATO */
.video-layer {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
}

.video-wrap {
  width: min(80vw, 360px);
  aspect-ratio: 9/16;
  display: flex;
  align-items: center;
  justify-content: center;
}

#playerVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

/* BOTTONI */
.close {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 30;
  display: none;
  background: rgba(0,0,0,0.7);
  color: white;
  border: none;
  border-radius: 50%;
  width: 40px;
  height: 40px;
}

.audio {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 30;
  display: none;
  background: gold;
  border: none;
  border-radius: 20px;
  padding: 8px 12px;
}
</style>
</head>

<body>

<div class="overlay" id="ui">
  <div class="card">
    <h2>D10S</h2>
    <p>Inquadra il target</p>
    <button class="btn" id="startBtn">Avvia</button>
  </div>
</div>

<button class="close" id="close">×</button>
<button class="audio" id="audio">🔊 Audio</button>

<div class="video-layer" id="videoLayer">
  <div class="video-wrap">
    <video id="playerVideo" src="video.mp4" playsinline muted></video>
  </div>
</div>

<a-scene mindar-image="imageTargetSrc: targets.mind; autoStart:false;" embedded>
  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex:0"></a-entity>
</a-scene>

<script>
const startBtn = document.getElementById("startBtn");
const ui = document.getElementById("ui");
const videoLayer = document.getElementById("videoLayer");
const video = document.getElementById("playerVideo");
const closeBtn = document.getElementById("close");
const audioBtn = document.getElementById("audio");

const scene = document.querySelector("a-scene");
const target = document.getElementById("target");

let playing = false;

function showVideo(){
  videoLayer.style.display = "flex";
  closeBtn.style.display = "block";
  audioBtn.style.display = "block";
}

function hideVideo(){
  videoLayer.style.display = "none";
  closeBtn.style.display = "none";
  audioBtn.style.display = "none";
}

async function playVideo(){
  if(playing) return;

  playing = true;

  video.pause();
  video.currentTime = 0;
  video.muted = true;

  showVideo();

  try{
    await video.play();
  }catch(e){}
}

function reset(){
  playing = false;
  video.pause();
  video.currentTime = 0;
  hideVideo();
}

startBtn.onclick = async ()=>{
  await scene.systems["mindar-image-system"].start();
  ui.style.display = "none";
};

target.addEventListener("targetFound", playVideo);

video.addEventListener("ended", reset);

closeBtn.onclick = reset;

audioBtn.onclick = ()=>{
  video.muted = false;
  video.play();
  audioBtn.style.display = "none";
};
</script>

</body>
</html>
