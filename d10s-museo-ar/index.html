<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>D10S Museo Maradona AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      color: white;
    }

    /* 🔴 FIX PRINCIPALE: NASCONDE UI DI MINDAR */
    .mindar-ui-overlay,
    .mindar-ui-scanning,
    .mindar-ui-loading,
    .mindar-ui-compatibility {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
    }

    canvas.a-canvas {
      width: 100vw !important;
      height: 100vh !important;
    }

    /* BACKGROUND */
    .stars, .stars::before, .stars::after {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      z-index: 3;
      background-image:
        radial-gradient(#ffffff 1px, transparent 1px),
        radial-gradient(#ffd700 1px, transparent 1px);
      background-size: 88px 88px, 138px 138px;
      opacity: .20;
    }

    /* SCANNER TUO */
    .scan-frame {
      position: fixed;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      display: none;
    }

    .scan-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(78vw, 390px);
      height: min(52vh, 340px);
      transform: translate(-50%, -50%);
    }

    .corner {
      position: absolute;
      width: 54px;
      height: 54px;
      border-color: rgba(255,255,255,.82);
      border-style: solid;
    }

    .c1 { top: 0; left: 0; border-width: 7px 0 0 7px; }
    .c2 { top: 0; right: 0; border-width: 7px 7px 0 0; }
    .c3 { bottom: 0; left: 0; border-width: 0 0 7px 7px; }
    .c4 { bottom: 0; right: 0; border-width: 0 7px 7px 0; }

    /* UI */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background: rgba(0,0,0,.9);
    }

    .btn {
      padding: 14px 22px;
      border-radius: 999px;
      border: none;
      font-weight: bold;
      background: #00a2ff;
      color: white;
      cursor: pointer;
    }

    .scan-label {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 15;
      display: none;
    }

    /* VIDEO */
    .video-layer {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      justify-content: center;
      align-items: center;
    }

    #playerVideo {
      width: 80vw;
      max-width: 360px;
    }

    .close-video {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: none;
    }
  </style>
</head>

<body>

<div class="overlay" id="ui">
  <button class="btn" id="startBtn">Avvia esperienza</button>
</div>

<div class="scan-frame" id="scanFrame">
  <div class="scan-box">
    <div class="corner c1"></div>
    <div class="corner c2"></div>
    <div class="corner c3"></div>
    <div class="corner c4"></div>
  </div>
</div>

<div class="scan-label" id="scanLabel">Inquadra il target</div>

<button class="close-video" id="closeVideo">X</button>

<div class="video-layer" id="videoLayer">
  <video id="playerVideo" playsinline muted></video>
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart:false;"
  embedded
  vr-mode-ui="enabled:false">

  <a-camera position="0 0 0"></a-camera>

  <a-entity id="target0" mindar-image-target="targetIndex:0"></a-entity>
</a-scene>

<script>
const startBtn = document.getElementById("startBtn");
const ui = document.getElementById("ui");
const scanFrame = document.getElementById("scanFrame");
const scanLabel = document.getElementById("scanLabel");
const videoLayer = document.getElementById("videoLayer");
const playerVideo = document.getElementById("playerVideo");
const closeVideo = document.getElementById("closeVideo");
const scene = document.querySelector("a-scene");
const target0 = document.getElementById("target0");

startBtn.onclick = async () => {
  await scene.systems["mindar-image-system"].start();
  ui.style.display = "none";
  scanFrame.style.display = "block";
  scanLabel.style.display = "block";
};

target0.addEventListener("targetFound", () => {
  playerVideo.src = "video.mp4";
  videoLayer.style.display = "flex";
  closeVideo.style.display = "block";
  playerVideo.play();
});

closeVideo.onclick = () => {
  playerVideo.pause();
  videoLayer.style.display = "none";
  closeVideo.style.display = "none";
  scanFrame.style.display = "block";
};
</script>

</body>
</html>
