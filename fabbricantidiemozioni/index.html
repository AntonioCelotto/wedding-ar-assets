<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Auguri di Pasqua AR – Fabbricanti di Emozioni</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(#fff1c9, #f6d998);
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    canvas.a-canvas {
      width: 100vw !important;
      height: 100vh !important;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: linear-gradient(#fff1c9, #f6d998);
    }

    .card {
      width: min(520px, 100%);
      background: rgba(255,255,255,.92);
      border-radius: 22px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
    }

    .card h2 {
      margin-top: 0;
      color: #7a4f00;
    }

    .card p {
      color: #5f4308;
      line-height: 1.5;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      background: #d49a24;
      color: white;
      font-size: 16px;
    }

    .badge {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      font-size: 14px;
      z-index: 30;
      color: #6a4a00;
      font-weight: 600;
    }

    .play-panel {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 35;
      display: none;
      background: rgba(255,255,255,.94);
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
      text-align: center;
      width: min(360px, calc(100vw - 24px));
    }

    .play-panel p {
      margin: 0 0 10px 0;
      color: #5f4308;
      font-size: 14px;
      line-height: 1.4;
    }

    .video-layer {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      pointer-events: none;
    }

    .video-wrap {
      width: min(72vw, 360px);
      aspect-ratio: 9 / 16;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #auguriVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
      background: transparent;
      box-shadow: 0 18px 50px rgba(0,0,0,.22);
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <div class="badge" id="status">AR pronta</div>

  <div class="overlay" id="ui">
    <div class="card">
      <h2>Auguri di Pasqua AR</h2>
      <p><strong>Fabbricanti di Emozioni</strong></p>
      <p>Tocca avvia e inquadra il biglietto di Pasqua.</p>
      <button class="btn" id="startBtn">Avvia esperienza</button>
    </div>
  </div>

  <div class="play-panel" id="playPanel">
    <p>Target rilevato</p>
    <button class="btn" id="playBtn">Riproduci auguri</button>
  </div>

  <div class="video-layer" id="videoLayer">
    <div class="video-wrap">
      <video
        id="auguriVideo"
        playsinline
        webkit-playsinline
        preload="auto"
        crossorigin="anonymous">
        <source src="https://video.wixstatic.com/video/047e10_81895633e5a449a080cbd1dac2523d5e/1080p/mp4/file.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind; autoStart:false;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false">

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- Un solo target -->
    <a-entity id="target0" mindar-image-target="targetIndex:0"></a-entity>

  </a-scene>

  <script>
    const startBtn = document.getElementById("startBtn");
    const playBtn = document.getElementById("playBtn");
    const ui = document.getElementById("ui");
    const status = document.getElementById("status");
    const playPanel = document.getElementById("playPanel");
    const videoLayer = document.getElementById("videoLayer");
    const auguriVideo = document.getElementById("auguriVideo");
    const scene = document.querySelector("a-scene");
    const target0 = document.getElementById("target0");

    let arStarted = false;
    let targetDetected = false;
    let videoStarted = false;

    function setStatus(text) {
      status.innerText = text;
    }

    startBtn.onclick = async () => {
      try {
        if (!arStarted) {
          await scene.systems["mindar-image-system"].start();
          arStarted = true;
        }
        ui.style.display = "none";
        setStatus("Inquadra il biglietto");
      } catch (e) {
        console.error("start ar:", e);
        setStatus("Errore avvio AR");
      }
    };

    target0.addEventListener("targetFound", () => {
      if (videoStarted) return;

      targetDetected = true;
      playPanel.style.display = "block";
      setStatus("Target rilevato");
    });

    target0.addEventListener("targetLost", () => {
      if (!videoStarted) {
        setStatus("Target perso");
      }
    });

    playBtn.onclick = async () => {
      if (!targetDetected) {
        setStatus("Inquadra prima il target");
        return;
      }

      try {
        auguriVideo.pause();
        auguriVideo.currentTime = 0;

        videoLayer.style.display = "flex";
        playPanel.style.display = "none";

        await auguriVideo.play();

        videoStarted = true;
        setStatus("Auguri in riproduzione");
      } catch (e) {
        console.error("video play:", e);
        setStatus("Errore riproduzione video");
      }
    };

    auguriVideo.addEventListener("ended", () => {
      setStatus("Esperienza terminata");
    });
  </script>

</body>
</html>
