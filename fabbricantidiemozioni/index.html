<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Pasqua AR – FDE</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    canvas.a-canvas {
      width: 100vw !important;
      height: 100vh !important;
    }

    .status {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,.82);
      color: #111;
      padding: 8px 12px;
      border-radius: 999px;
      z-index: 30;
      font-size: 14px;
      font-weight: 600;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .hint {
      background: rgba(0,0,0,.55);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      text-align: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      max-width: 90vw;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      background: #d4a24b;
      color: #111;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="status" id="status">AR pronta</div>

  <div class="controls" id="controls">
    <div class="hint" id="hint">Tocca “Avvia esperienza” e inquadra il target.</div>
    <button class="btn" id="startBtn">Avvia esperienza</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind; autoStart:false;"
    embedded
    renderer="alpha:true; colorManagement:true, physicallyCorrectLights"
    color-space="sRGB"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false">

    <a-assets>
      <video
        id="video"
        src="https://video.wixstatic.com/video/047e10_81895633e5a449a080cbd1dac2523d5e/1080p/mp4/file.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera id="camera" position="0 0 0" look-controls="enabled:false">
      <a-plane
        id="screenPlane"
        width="0.95"
        height="1.69"
        position="0 0 -1.9"
        visible="false"
        material="shader: flat; src:#video; transparent:true; side:double">
      </a-plane>
    </a-camera>

    <a-entity id="target" mindar-image-target="targetIndex:0"></a-entity>

  </a-scene>

  <script>
    const startBtn = document.getElementById("startBtn");
    const controls = document.getElementById("controls");
    const hint = document.getElementById("hint");
    const status = document.getElementById("status");

    const sceneEl = document.querySelector("a-scene");
    const targetEl = document.getElementById("target");
    const screenPlane = document.getElementById("screenPlane");
    const video = document.getElementById("video");

    let arStarted = false;
    let experienceTriggered = false;
    let mediaUnlocked = false;

    function setStatus(text) {
      status.textContent = text;
    }

    async function unlockMedia() {
      if (mediaUnlocked) return;

      try {
        video.muted = true;
        video.currentTime = 0;
        await video.play();
        video.pause();
        video.currentTime = 0;
        video.muted = false;
        mediaUnlocked = true;
      } catch (err) {
        console.error("Errore sblocco media:", err);
      }
    }

    async function startAR() {
      if (arStarted) return;
      arStarted = true;

      try {
        await sceneEl.systems["mindar-image-system"].start();
        setStatus("Inquadra il target");
        hint.textContent = "Sto cercando il target…";
      } catch (err) {
        console.error(err);
        setStatus("Errore avvio AR");
        hint.textContent = "Impossibile avviare la fotocamera.";
      }
    }

    async function playVideoWithAudio() {
      try {
        video.pause();
        video.currentTime = 0;
        video.muted = false;
        await video.play();
      } catch (err) {
        console.error("Errore play video:", err);
      }
    }

    startBtn.addEventListener("click", async () => {
      await unlockMedia();
      await startAR();
      startBtn.classList.add("hidden");
    });

    targetEl.addEventListener("targetFound", async () => {
      if (experienceTriggered) return;

      experienceTriggered = true;

      setStatus("Target rilevato");
      hint.textContent = "Esperienza avviata";

      screenPlane.setAttribute("visible", true);
      await playVideoWithAudio();

      setTimeout(() => {
        controls.classList.add("hidden");
      }, 800);
    });

    targetEl.addEventListener("targetLost", () => {
      // ignorato volutamente:
      // il video resta fisso e continua fino alla fine
    });

    video.addEventListener("ended", () => {
      setStatus("Video terminato");
    });
  </script>

</body>
</html>
