<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Auguri di Pasqua AR – Fabbricanti di Emozioni</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: transparent;
    }

    body {
      background: linear-gradient(#fff4d9, #f7ddb0);
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    canvas.a-canvas {
      width: 100vw !important;
      height: 100vh !important;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: linear-gradient(#fff4d9, #f7ddb0);
      padding: 18px;
      box-sizing: border-box;
    }

    .card {
      width: min(520px, 100%);
      background: rgba(255,255,255,.92);
      border-radius: 22px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
    }

    .card h2 {
      margin: 0 0 10px 0;
      font-size: 26px;
      color: #6f4b12;
    }

    .card p {
      margin: 0 0 16px 0;
      line-height: 1.5;
      color: #4d3b1e;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      background: #d4a24b;
      color: #1d1405;
      font-size: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
    }

    .btn.secondary {
      background: #8f5b12;
      color: white;
    }

    .badge {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      font-size: 14px;
      z-index: 30;
      font-weight: 600;
      color: #4d3b1e;
    }

    .mini-panel {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(255,255,255,.92);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
      display: none;
      width: min(420px, calc(100vw - 24px));
      text-align: center;
    }

    .mini-panel p {
      margin: 0 0 12px 0;
      color: #4d3b1e;
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="badge" id="status">AR pronta</div>

  <div class="overlay" id="ui">
    <div class="card">
      <h2>Pasqua AR Experience</h2>
      <p><strong>Fabbricanti di Emozioni</strong></p>
      <p>Tocca avvia e inquadra il biglietto di Pasqua per sbloccare il video di auguri.</p>
      <button class="btn" id="startBtn">Avvia esperienza</button>
    </div>
  </div>

  <div class="mini-panel" id="playPanel">
    <p>Target rilevato. Tocca qui per riprodurre il video di auguri.</p>
    <button class="btn secondary" id="playBtn">Riproduci auguri</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind; autoStart:false;"
    embedded
    renderer="alpha:true; colorManagement:true, physicallyCorrectLights"
    color-space="sRGB"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false">

    <a-assets>
      <video
        id="video"
        src="https://video.wixstatic.com/video/047e10_81895633e5a449a080cbd1dac2523d5e/1080p/mp4/file.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera id="camera" position="0 0 0" look-controls="enabled:false">
      <a-plane
        id="screenPlane"
        width="0.95"
        height="1.69"
        position="0 0 -1.9"
        visible="false"
        material="shader: flat; src:#video; transparent:true; side:double">
      </a-plane>
    </a-camera>

    <a-entity id="target" mindar-image-target="targetIndex:0"></a-entity>
  </a-scene>

  <script>
    const startBtn = document.getElementById("startBtn");
    const playBtn = document.getElementById("playBtn");
    const ui = document.getElementById("ui");
    const playPanel = document.getElementById("playPanel");
    const status = document.getElementById("status");

    const sceneEl = document.querySelector("a-scene");
    const targetEl = document.getElementById("target");
    const screenPlane = document.getElementById("screenPlane");
    const video = document.getElementById("video");

    let arStarted = false;
    let targetSeen = false;
    let videoStarted = false;

    function setStatus(text) {
      status.textContent = text;
    }

    async function startAR() {
      if (arStarted) return;
      arStarted = true;

      try {
        await sceneEl.systems["mindar-image-system"].start();
        ui.classList.add("hidden");
        setStatus("Inquadra il biglietto");
      } catch (err) {
        console.error(err);
        setStatus("Errore avvio AR");
      }
    }

    async function playVideo() {
      if (videoStarted) return;

      try {
        video.pause();
        video.currentTime = 0;
        screenPlane.setAttribute("visible", true);
        await video.play();
        videoStarted = true;
        playPanel.style.display = "none";
        setStatus("Auguri in riproduzione");
      } catch (err) {
        console.error("Errore play video:", err);
        setStatus("Tocca di nuovo per riprodurre");
      }
    }

    startBtn.addEventListener("click", async () => {
      await startAR();
    });

    targetEl.addEventListener("targetFound", () => {
      if (videoStarted) return;

      targetSeen = true;
      playPanel.style.display = "block";
      setStatus("Target rilevato");
    });

    targetEl.addEventListener("targetLost", () => {
      if (!videoStarted) {
        setStatus("Target perso");
      }
    });

    playBtn.addEventListener("click", async () => {
      if (!targetSeen) {
        setStatus("Inquadra prima il target");
        return;
      }
      await playVideo();
    });

    video.addEventListener("ended", () => {
      setStatus("Video terminato");
    });
  </script>

</body>
</html>
