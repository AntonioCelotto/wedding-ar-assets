<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Auguri di Pasqua AR – Fabbricanti di Emozioni</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(#fff1c9, #f6d998);
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    canvas.a-canvas {
      width: 100vw !important;
      height: 100vh !important;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.20), rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #fff4d9 0%, #f6d998 100%);
    }

    .card {
      width: min(560px, 100%);
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 22px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 18px 55px rgba(0,0,0,.20);
      backdrop-filter: blur(10px);
    }

    .title {
      margin: 2px 0 6px;
      font-size: 22px;
      font-weight: 900;
      color: #7a4f00;
    }

    .sub {
      margin: 0 0 12px;
      font-size: 14px;
      color: rgba(80,55,8,.85);
      line-height: 1.45;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
      background: #d49a24;
      color: white;
      font-size: 16px;
    }

    .pill {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      z-index: 30;
      pointer-events: none;
    }

    .badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(255,255,255,.92);
      color: rgba(80,55,8,.9);
      font-size: 13px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }

    .badge strong {
      color: #7a4f00;
      font-weight: 900;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="pill">
  <div class="badge" id="status"><strong>AR</strong> Pronta ✨</div>
  <div class="badge hidden" id="page">Inquadra il biglietto</div>
</div>

<div class="overlay" id="ui">
  <div class="card">
    <div class="title">Auguri di Pasqua AR</div>
    <div class="sub"><strong>Fabbricanti di Emozioni</strong></div>
    <div class="sub">Tocca “Avvia esperienza”, consenti la fotocamera, poi inquadra il biglietto di Pasqua.</div>
    <div class="row">
      <button class="btn" id="startBtn">Avvia esperienza</button>
    </div>
    <div class="sub" style="margin-top:10px;font-size:12.5px;">
      Consiglio: luce buona + target fermo per 1–2 secondi.
    </div>
  </div>
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiError: no;"
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-assets>
    <video
      id="v1"
      crossorigin="anonymous"
      src="https://video.wixstatic.com/video/047e10_81895633e5a449a080cbd1dac2523d5e/1080p/mp4/file.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      muted>
    </video>
  </a-assets>

  <a-camera id="cam" position="0 0 0" look-controls="enabled:false">
    <!-- Video verticale, fisso e frontale -->
    <a-entity id="fixedVideo" visible="false">
      <a-plane
        id="fixedPlane"
        width="0.95"
        height="1.69"
        position="0 0 -1.35"
        rotation="0 0 0"
        material="shader: flat; src: #v1; transparent: true; side: double">
      </a-plane>
    </a-entity>
  </a-camera>

  <!-- Un solo target -->
  <a-entity id="t0" mindar-image-target="targetIndex: 0"></a-entity>

</a-scene>

<script>
  const ui = document.getElementById("ui");
  const startBtn = document.getElementById("startBtn");
  const status = document.getElementById("status");
  const page = document.getElementById("page");

  const scene = document.querySelector("a-scene");
  const target = document.getElementById("t0");
  const v1 = document.getElementById("v1");

  const fixedVideo = document.getElementById("fixedVideo");
  const fixedPlane = document.getElementById("fixedPlane");

  function setStatus(text) {
    status.textContent = "AR " + text;
  }

  function stopVideo() {
    try {
      v1.pause();
      v1.currentTime = 0;
    } catch(e) {}
  }

  async function unlockVideo() {
    try {
      v1.muted = true;
      await v1.play();
      v1.pause();
      v1.currentTime = 0;
    } catch(e) {}
  }

  function showFixedVideo() {
    fixedVideo.setAttribute("visible", true);

    fixedPlane.setAttribute("scale", "0.001 0.001 0.001");
    fixedPlane.setAttribute("animation__in", `
      property: scale;
      to: 1 1 1;
      dur: 220;
      easing: easeOutQuad;
    `);
  }

  function hideFixedVideo() {
    fixedPlane.setAttribute("animation__out", `
      property: scale;
      to: 0.001 0.001 0.001;
      dur: 140;
      easing: easeInQuad;
    `);

    setTimeout(() => {
      fixedVideo.setAttribute("visible", false);
      fixedPlane.setAttribute("scale", "1 1 1");
    }, 150);
  }

  startBtn.addEventListener("click", async () => {
    await unlockVideo();
    await scene.systems["mindar-image-system"].start();
    ui.style.display = "none";
    setStatus("Inquadra il biglietto ✨");
    page.classList.remove("hidden");
    page.textContent = "Inquadra il biglietto";
  });

  target.addEventListener("targetFound", async () => {
    setStatus("Trovato ✅");
    page.textContent = "In riproduzione…";

    showFixedVideo();

    stopVideo();
    try {
      v1.muted = true;
      await v1.play();
    } catch(e) {
      console.error("video play:", e);
    }
  });

  target.addEventListener("targetLost", () => {
    setStatus("Inquadra il biglietto ✨");
    page.textContent = "Inquadra il biglietto";

    hideFixedVideo();
    stopVideo();
  });

  v1.addEventListener("ended", () => {
    setStatus("Esperienza terminata");
    page.textContent = "Video terminato";
    hideFixedVideo();
  });
</script>

</body>
</html>
