<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Cappellino AR – NDA</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
}

body{
background:linear-gradient(#ffd6e3,#f7b2c7);
}

a-scene{
position:fixed!important;
inset:0!important;
width:100vw!important;
height:100vh!important;
}

canvas.a-canvas{
width:100vw!important;
height:100vh!important;
}

.overlay{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
z-index:20;
background:linear-gradient(#ffd6e3,#f7b2c7);
}

.card{
width:min(520px,100%);
background:rgba(255,255,255,.9);
border-radius:22px;
padding:20px;
text-align:center;
box-shadow:0 18px 50px rgba(0,0,0,.18);
}

.btn{
border:none;
border-radius:999px;
padding:12px 18px;
font-weight:800;
cursor:pointer;
background:#ff4d88;
color:white;
}

.badge{
position:fixed;
top:10px;
left:10px;
padding:10px 14px;
border-radius:999px;
background:rgba(255,255,255,.7);
font-size:14px;
z-index:30;
}

#frameCanvas{
display:none;
}
</style>
</head>

<body>

<div class="badge" id="status">AR pronto</div>

<div class="overlay" id="ui">
<div class="card">
<h2>Cappellino AR Experience</h2>
<p>Tocca avvia e inquadra il cappellino</p>
<button class="btn" id="startBtn">Avvia esperienza</button>
</div>
</div>

<canvas id="frameCanvas" width="512" height="288"></canvas>

<a-scene
mindar-image="imageTargetSrc: targets.mind; autoStart:false;"
embedded
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>

<audio id="audio1" preload="auto" playsinline>
<source src="./assets/audio/audioavatarnda.mp3" type="audio/mpeg">
</audio>

</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity id="target0" mindar-image-target="targetIndex:0">

<a-plane
id="plane0"
width="1"
height="0.5625"
visible="false"
material="shader:flat; src:#frameCanvas; transparent:true; alphaTest:0.01">
</a-plane>

</a-entity>

</a-scene>

<script>

const startBtn=document.getElementById("startBtn");
const ui=document.getElementById("ui");
const status=document.getElementById("status");
const scene=document.querySelector("a-scene");

const target0=document.getElementById("target0");
const plane0=document.getElementById("plane0");
const audio1=document.getElementById("audio1");

const frameCanvas=document.getElementById("frameCanvas");
const ctx=frameCanvas.getContext("2d");

const TILE_W=512;
const TILE_H=288;
const COLS=8;

const FPS=25;
const TOTAL_FRAMES=602;

const spriteDefs=[
{src:"./assets/avatar/sprite_1.png",start:0,count:64},
{src:"./assets/avatar/sprite_2.png",start:64,count:64},
{src:"./assets/avatar/sprite_3.png",start:128,count:64},
{src:"./assets/avatar/sprite_4.png",start:192,count:64},
{src:"./assets/avatar/sprite_5.png",start:256,count:64},
{src:"./assets/avatar/sprite_6.png",start:320,count:64},
{src:"./assets/avatar/sprite_7.png",start:384,count:64},
];

let sprites=[];
let spritesLoaded=false;
let animTimer=null;

function refreshTexture(){

const mat=plane0.components.material;

if(mat && mat.material && mat.material.map){
mat.material.map.needsUpdate=true;
}

}

async function loadSprites(){

sprites=await Promise.all(
spriteDefs.map(def=>new Promise((resolve,reject)=>{

const img=new Image();

img.onload=()=>resolve({...def,img});
img.onerror=reject;

img.src=def.src+"?v=9";

}))
);

spritesLoaded=true;

}

function getSprite(frame){

for(const s of sprites){

if(frame>=s.start && frame<s.start+s.count){
return s;
}

}

return sprites[0];

}

function drawFrame(frame){

const sprite=getSprite(frame);

const local=frame-sprite.start;

const col=local%COLS;
const row=Math.floor(local/COLS);

const sx=col*TILE_W;
const sy=row*TILE_H;

ctx.clearRect(0,0,frameCanvas.width,frameCanvas.height);

ctx.drawImage(
sprite.img,
sx,sy,TILE_W,TILE_H,
0,0,frameCanvas.width,frameCanvas.height
);

refreshTexture();

}

function startAnimation(){

let frame=0;

animTimer=setInterval(()=>{

frame++;

if(frame>=TOTAL_FRAMES){
frame=TOTAL_FRAMES-1;
clearInterval(animTimer);
}

drawFrame(frame);

},1000/FPS);

}

async function unlockAudio(){

try{
await audio1.play();
audio1.pause();
audio1.currentTime=0;
}catch(e){}

}

startBtn.onclick=async()=>{

await unlockAudio();

await scene.systems["mindar-image-system"].start();

ui.style.display="none";

status.innerText="Inquadra il cappellino";

};

target0.addEventListener("targetFound",async()=>{

plane0.setAttribute("visible",true);

status.innerText="AR trovato";

if(!spritesLoaded){
await loadSprites();
}

drawFrame(0);

startAnimation();

try{
audio1.currentTime=0;
await audio1.play();
}catch(e){}

});

target0.addEventListener("targetLost",()=>{

plane0.setAttribute("visible",false);

status.innerText="Inquadra il cappellino";

if(animTimer){
clearInterval(animTimer);
}

audio1.pause();
audio1.currentTime=0;

});

</script>

</body>
</html>
