<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cappellino AR – NDA</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(#ffd6e3, #f7b2c7);
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    canvas.a-canvas {
      width: 100vw !important;
      height: 100vh !important;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 20;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%),
        linear-gradient(#ffd6e3, #f7b2c7);
    }

    .card {
      width: min(520px, 100%);
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 22px;
      padding: 18px;
      text-align:center;
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
    }

    .title {
      margin: 2px 0 6px;
      font-size: 20px;
      font-weight: 800;
      color:#2b1220;
    }

    .sub {
      margin: 0 0 12px;
      font-size: 14px;
      color: rgba(43,18,32,.75);
      line-height: 1.4;
    }

    .row {
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      background: rgba(255,255,255,.95);
      color: #2b1220;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
    }

    .btn.primary {
      background: #ff4d88;
      color: white;
    }

    .pill {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      z-index: 30;
      pointer-events:none;
    }

    .badge {
      pointer-events:auto;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.8);
      color: rgba(43,18,32,.85);
      font-size: 13px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.12);
    }

    .badge strong { font-weight: 900; }
    .hidden { display:none !important; }

    #frameCanvas {
      display: none;
    }
  </style>
</head>

<body>

<div class="pill">
  <div class="badge" id="status"><strong>AR</strong> Pronto ✨</div>
  <div class="badge hidden" id="page">Target: cappellino</div>
</div>

<div class="overlay" id="ui">
  <div class="card">
    <div class="title">Cappellino AR Experience</div>
    <div class="sub">
      Tocca “Avvia esperienza”, consenti la fotocamera e inquadra il cappellino.
    </div>
    <div class="row">
      <button class="btn primary" id="startBtn">Avvia esperienza</button>
      <button class="btn" id="helpBtn">Come funziona</button>
    </div>
    <div class="sub" style="margin-top:10px;font-size:12.5px;">
      Consiglio: luce buona + cappellino fermo per 1–2 secondi
    </div>
  </div>
</div>

<canvas id="frameCanvas" width="512" height="288"></canvas>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiError: no;"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <audio id="audio1" crossorigin="anonymous" preload="auto" playsinline>
      <source src="./assets/audio/audioavatarnda.mp3" type="audio/mpeg">
    </audio>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity id="target0" mindar-image-target="targetIndex: 0">
    <a-plane
      id="plane0"
      width="1.0"
      height="0.5625"
      visible="false"
      material="shader: flat; src: #frameCanvas; transparent: true; alphaTest: 0.01">
    </a-plane>
  </a-entity>

</a-scene>

<script>
  const ui = document.getElementById("ui");
  const startBtn = document.getElementById("startBtn");
  const helpBtn = document.getElementById("helpBtn");
  const status = document.getElementById("status");
  const page = document.getElementById("page");
  const scene = document.querySelector("a-scene");

  const target0 = document.getElementById("target0");
  const plane0 = document.getElementById("plane0");
  const audio1 = document.getElementById("audio1");

  const frameCanvas = document.getElementById("frameCanvas");
  const ctx = frameCanvas.getContext("2d", { alpha: true });

  const TILE_W = 512;
  const TILE_H = 288;
  const COLS = 8;

  const spriteDefs = [
    { src: "./assets/avatar/sprite_1.png",  start: 0,   count: 64 },
    { src: "./assets/avatar/sprite_2.png",  start: 64,  count: 64 },
    { src: "./assets/avatar/sprite_3.png",  start: 128, count: 64 },
    { src: "./assets/avatar/sprite_4.png",  start: 192, count: 64 },
    { src: "./assets/avatar/sprite_5.png",  start: 256, count: 64 },
    { src: "./assets/avatar/sprite_6.png",  start: 320, count: 64 },
    { src: "./assets/avatar/sprite_7.png",  start: 384, count: 64 },
    { src: "./assets/avatar/sprite_8.png",  start: 448, count: 64 },
    { src: "./assets/avatar/sprite_9.png",  start: 512, count: 64 },
    { src: "./assets/avatar/sprite_10.png", start: 576, count: 26 }
  ];

  let sprites = [];
  let spritesLoaded = false;
  let animTimer = null;
  let arStarted = false;

  function setStatus(text) {
    status.textContent = "AR " + text;
  }

  function stopAudio() {
    try {
      audio1.pause();
      audio1.currentTime = 0;
    } catch (e) {}
  }

  async function unlockAudio() {
    try {
      audio1.volume = 1;
      await audio1.play();
      audio1.pause();
      audio1.currentTime = 0;
    } catch (e) {
      console.error("unlockAudio:", e);
    }
  }

  function refreshTexture() {
    const mat = plane0.components.material;
    if (mat && mat.material && mat.material.map) {
      mat.material.map.needsUpdate = true;
    }
  }

  async function loadSpritesOnce() {
    if (spritesLoaded) return;

    setStatus("Carico animazione...");
    page.classList.remove("hidden");
    page.textContent = "Carico animazione...";

    sprites = await Promise.all(
      spriteDefs.map(def => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve({ ...def, img });
        img.onerror = () => reject(new Error("Errore caricamento " + def.src));
        img.src = def.src + "?v=8";
      }))
    );

    spritesLoaded = true;
  }

  function getSpriteForFrame(frameIndex) {
    for (const s of sprites) {
      if (frameIndex >= s.start && frameIndex < s.start + s.count) {
        return s;
      }
    }
    return sprites[0];
  }

  function drawFrame(frameIndex) {
    if (!spritesLoaded) return;

    const sprite = getSpriteForFrame(frameIndex);
    const localIndex = frameIndex - sprite.start;

    const col = localIndex % COLS;
    const row = Math.floor(localIndex / COLS);

    const sx = col * TILE_W;
    const sy = row * TILE_H;

    console.log("frame:", frameIndex, "sprite start:", sprite.start);

    ctx.clearRect(0, 0, frameCanvas.width, frameCanvas.height);
    ctx.drawImage(
      sprite.img,
      sx, sy, TILE_W, TILE_H,
      0, 0, frameCanvas.width, frameCanvas.height
    );

    refreshTexture();
  }

  function stopAnimation() {
    if (animTimer) {
      clearInterval(animTimer);
      animTimer = null;
    }
  }

  function startAnimation() {
    stopAnimation();

    const testFrames = [0, 20, 40, 63, 64, 84, 104, 127, 128, 148, 168, 191];
    let idx = 0;

    drawFrame(testFrames[idx]);
    page.textContent = "Frame test: " + testFrames[idx];

    animTimer = setInterval(() => {
      idx++;
      if (idx >= testFrames.length) {
        idx = 0;
      }
      drawFrame(testFrames[idx]);
      page.textContent = "Frame test: " + testFrames[idx];
    }, 800);
  }

  helpBtn.addEventListener("click", () => {
    alert("1) Tocca 'Avvia esperienza'\\n2) Consenti la fotocamera\\n3) Inquadra il cappellino");
  });

  startBtn.addEventListener("click", async () => {
    try {
      await unlockAudio();
      await scene.systems["mindar-image-system"].start();

      arStarted = true;
      ui.style.display = "none";
      page.classList.remove("hidden");
      page.textContent = "Target: cappellino";
      setStatus("Inquadra il cappellino ✨");
    } catch (e) {
      console.error("Errore avvio AR:", e);
      alert("AR non avviata. Controlla targets.mind e i permessi fotocamera.");
    }
  });

  target0.addEventListener("targetFound", async () => {
    try {
      plane0.setAttribute("visible", true);
      setStatus("Trovato ✅");
      page.textContent = "Carico animazione...";

      await loadSpritesOnce();

      startAnimation();

      if (arStarted) {
        try {
          audio1.currentTime = 0;
          await audio1.play();
        } catch (e) {
          console.error("audio play:", e);
        }
      }
    } catch (e) {
      console.error("Errore targetFound:", e);
      setStatus("Errore asset");
      page.textContent = "Errore caricamento sprite";
    }
  });

  target0.addEventListener("targetLost", () => {
    plane0.setAttribute("visible", false);
    setStatus("Inquadra il cappellino ✨");
    page.textContent = "Target: cappellino";
    stopAnimation();
    stopAudio();
    ctx.clearRect(0, 0, frameCanvas.width, frameCanvas.height);
    refreshTexture();
  });
</script>

</body>
</html>
