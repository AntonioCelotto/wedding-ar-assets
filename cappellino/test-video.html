<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test video alpha</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: Arial, sans-serif;
      background: linear-gradient(45deg, red, blue);
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    video {
      width: 320px;
      max-width: 90vw;
      height: auto;
      background: rgba(255,255,255,0.15);
      border: 2px solid white;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
    }

    #log {
      background: rgba(0,0,0,0.35);
      padding: 12px;
      border-radius: 10px;
      width: min(500px, 90vw);
      font-size: 14px;
      white-space: pre-wrap;
      text-align: left;
    }
  </style>
</head>
<body>

  <h1>Test video-alpha.webm</h1>

  <video id="v" playsinline webkit-playsinline muted loop preload="auto" controls>
    <source src="./assets/avatar/video-alpha.webm" type="video/webm">
    Il browser non supporta il tag video.
  </video>

  <button id="playBtn">Play test</button>

  <div id="log">Pronto</div>

  <script>
    const v = document.getElementById("v");
    const log = document.getElementById("log");
    const btn = document.getElementById("playBtn");

    function write(msg) {
      log.textContent += "\n" + msg;
      console.log(msg);
    }

    v.addEventListener("loadedmetadata", () => write("loadedmetadata OK"));
    v.addEventListener("canplay", () => write("canplay OK"));
    v.addEventListener("play", () => write("play event OK"));
    v.addEventListener("error", () => {
      write("ERRORE video");
      if (v.error) {
        write("code: " + v.error.code);
      }
    });

    btn.addEventListener("click", async () => {
      write("click sul bottone");
      try {
        const p = v.play();
        if (p !== undefined) {
          await p;
        }
        write("play() eseguito");
      } catch (e) {
        write("play() fallito: " + e.message);
      }
    });
  </script>

</body>
</html>
