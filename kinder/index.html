<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kinder AR – NDA</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial; }
    body { background:#0d0f16; }

    .overlay {
      position: fixed; inset: 0;
      display:flex; align-items:center; justify-content:center;
      z-index: 20;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.18), rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #0b2a7a 0%, #0d0f16 55%, #c9492f 120%);
    }
    .card {
      width: min(560px, 100%);
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.70);
      border-radius: 22px;
      padding: 18px;
      text-align:center;
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    .title { margin: 2px 0 6px; font-size: 20px; font-weight: 900; color:#0b2a7a; }
    .sub { margin: 0 0 12px; font-size: 14px; color: rgba(0,0,0,.70); line-height: 1.4; }

    .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .btn {
      border: none; border-radius: 999px;
      padding: 12px 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
    }
    .btn.primary { background: #0b2a7a; color: white; }
    .btn.white { background: #ffffff; color: #0b2a7a; border: 1px solid rgba(11,42,122,.25); }

    .pill {
      position: fixed; top: 10px; left: 10px; right: 10px;
      display:flex; justify-content:space-between; gap:10px;
      z-index: 30;
      pointer-events:none;
    }
    .badge {
      pointer-events:auto;
      display:inline-flex; align-items:center; gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.9);
      color: rgba(0,0,0,.75);
      font-size: 13px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .badge strong { color:#0b2a7a; font-weight: 900; }
    .hidden { display:none !important; }

    .audioBtn {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: none;
      background: #c9492f;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="pill">
  <div class="badge" id="status"><strong>AR</strong> Pronto ✨</div>
  <div class="badge hidden" id="page">Inquadra il Kinder</div>
</div>

<div class="overlay" id="ui">
  <div class="card">
    <div class="title">Kinder AR Experience</div>
    <div class="sub">Tocca “Avvia”, consenti la fotocamera, poi inquadra il prodotto/immagine target.</div>
    <div class="row">
      <button class="btn primary" id="startBtn">Avvia esperienza</button>
      <button class="btn white" id="helpBtn">Come funziona</button>
    </div>
    <div class="sub" style="margin-top:10px;font-size:12.5px;">
      Consiglio: luce buona + target fermo 1–2 sec.
    </div>
  </div>
</div>

<button class="audioBtn" id="audioBtn">Attiva audio</button>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiError: no;"
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-assets>
    <video id="v1" crossorigin="anonymous"
      src="https://video.wixstatic.com/video/047e10_0a43b7ad5180411290646dbbe8dd4f19/1080p/mp4/file.mp4"
      preload="auto" playsinline webkit-playsinline muted></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- TARGET: qui l'oggetto è ANCORATO al target, ma lo facciamo "uscire" -->
  <a-entity id="t0" mindar-image-target="targetIndex: 0">
    <a-entity id="videoWrap"
      position="0 0 0"
      scale="0.001 0.001 0.001"
      rotation="0 0 0"
      visible="false">
      <!-- NOTA: width/height più grandi del target = "fuori dal raggio" -->
      <a-plane id="videoPlane"
        width="2.2" height="1.2375"
        position="0 0 0"
        material="shader: flat; src: #v1">
      </a-plane>
    </a-entity>
  </a-entity>

</a-scene>

<script>
  const ui = document.getElementById("ui");
  const startBtn = document.getElementById("startBtn");
  const helpBtn = document.getElementById("helpBtn");
  const status = document.getElementById("status");
  const page = document.getElementById("page");
  const audioBtn = document.getElementById("audioBtn");

  const scene = document.querySelector("a-scene");
  const target = document.getElementById("t0");
  const v1 = document.getElementById("v1");

  const videoWrap = document.getElementById("videoWrap");

  function setStatus(text){ status.textContent = "AR " + text; }

  function stopVideo(){
    try { v1.pause(); v1.currentTime = 0; } catch(e){}
  }

  async function unlockVideo() {
    try {
      v1.muted = true;
      await v1.play();
      v1.pause();
      v1.currentTime = 0;
    } catch(e){}
  }

  helpBtn.addEventListener("click", () => {
    alert("1) Tocca 'Avvia esperienza'\n2) Consenti la fotocamera\n3) Inquadra il target Kinder");
  });

  startBtn.addEventListener("click", async () => {
    await unlockVideo();
    await scene.systems["mindar-image-system"].start();
    ui.style.display = "none";
    setStatus("Inquadra il Kinder ✨");
    page.classList.remove("hidden");
  });

  // === CONFIG EFFETTO "POP OUT" ===
  // Posizione finale: sinistra / su / "fuori" (verso camera)
  // Se non esce verso camera: cambia Z da 0.18 a -0.18 (dipende dall'orientamento del target)
  const FINAL_POS = { x: -0.45, y: 0.35, z: 0.18 };
  const FINAL_SCALE = { x: 1, y: 1, z: 1 };
  const DUR = 260;

  function showPopOut() {
    videoWrap.setAttribute("visible", true);

    // reset iniziale
    videoWrap.setAttribute("position", "0 0 0");
    videoWrap.setAttribute("scale", "0.001 0.001 0.001");

    // animazione: scala + movimento
    videoWrap.setAttribute("animation__scalein", `
      property: scale;
      to: ${FINAL_SCALE.x} ${FINAL_SCALE.y} ${FINAL_SCALE.z};
      dur: ${DUR};
      easing: easeOutBack;
    `);

    videoWrap.setAttribute("animation__posin", `
      property: position;
      to: ${FINAL_POS.x} ${FINAL_POS.y} ${FINAL_POS.z};
      dur: ${DUR};
      easing: easeOutQuad;
    `);
  }

  function hidePopOut() {
    videoWrap.setAttribute("animation__scaleout", `
      property: scale;
      to: 0.001 0.001 0.001;
      dur: 160;
      easing: easeInQuad;
    `);

    setTimeout(() => {
      videoWrap.setAttribute("visible", false);
    }, 170);
  }

  target.addEventListener("targetFound", async () => {
    setStatus("Trovato ✅");
    page.textContent = "In riproduzione…";

    showPopOut();

    stopVideo();
    try {
      v1.muted = true;
      await v1.play();
      audioBtn.style.display = "inline-block";
    } catch(e){}
  });

  target.addEventListener("targetLost", () => {
    setStatus("Inquadra il Kinder ✨");
    page.textContent = "Inquadra il Kinder";
    audioBtn.style.display = "none";

    hidePopOut();
    stopVideo();
  });

  audioBtn.addEventListener("click", async () => {
    try {
      v1.muted = false;
      await v1.play();
      audioBtn.style.display = "none";
    } catch(e){}
  });
</script>

</body>
</html>
